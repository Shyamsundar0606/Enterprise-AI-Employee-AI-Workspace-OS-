[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-employee-backend"
version = "0.1.0"
description = "Backend foundation for Enterprise AI Employee"
requires-python = ">=3.12"

dependencies = [
    "aiosqlite>=0.10,<1.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "bcrypt>=4.1,<5.0",
    "fastapi>=0.115,<1.0",
    "email-validator>=2.2,<3.0",
    "httpx>=0.28,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-ollama>=0.2,<1.0",
    "langgraph>=0.2,<1.0",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=5.0,<6.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.2,<6.0",
    "sqlalchemy>=2.0.36,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1,<26.0",
    "httpx>=0.28,<1.0",
    "pre-commit>=4.1,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["build", "Lib", "Include", "Scripts", ".venv", "node_modules"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["build", "Lib", "Include", "Scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''/(build|Lib|Include|Scripts)/'''
